name: Automatic check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check-exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Code recovery
        uses: actions/checkout@v4

      - name: Tools installation
        run: sudo apt-get update && sudo apt-get install -y gcc valgrind

      - name: 00-00 check
        if: always()
        run: |
          cd 00-c-beginner/00-guess-the-number
          chmod +x check.sh
          ./check.sh

      - name: 00-02 check
        if: always()
        run: |
          cd 00-c-beginner/02-ascii-game-of-life
          chmod +x check.sh
          ./check.sh
