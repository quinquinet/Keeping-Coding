name: Module 00 - C Re Introduction - Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check-exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Code recovery
        uses: actions/checkout@v4

      - name: Tools installation
        run: sudo apt-get update && sudo apt-get install -y gcc valgrind

      - name: Hello World
        shell: bash
        run: |
          cd 00-c-re-introduction/00-hello-world
          chmod +x ./check.sh
          ./check.sh
          cd ../..

      - name: Strlen
        shell: bash
        run: |
          cd 00-c-re-introduction/01-strlen
          chmod +x ./check.sh
          ./check.sh
          cd ../..

      - name: Strcpy
        shell: bash
        run: |
          cd 00-c-re-introduction/01-strcpy
          chmod +x ./check.sh
          ./check.sh
          cd ../..

      - name: Strcpy
        shell: bash
        run: |
          cd 00-c-re-introduction/01-strcpy
          chmod +x ./check.sh
          ./check.sh
          cd ../..