name: Module 01 - C Input/Output Games - Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check-exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Code recovery
        uses: actions/checkout@v4

      - name: Tools installation
        run: sudo apt-get update && sudo apt-get install -y gcc valgrind

      - name: Checking exercises
        shell: bash
        run: |
          cd 01-c-io-games
          set -e
          for dir in ./*; do
            if [ -f "$dir/check.sh" ]; then
              echo "In $dir"
              (
                cd "$dir"
                chmod +x ./check.sh
                ./check.sh
              ) || exit 1
            fi
          done